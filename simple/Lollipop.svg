		my experiment making the spiral:
		it's constructed like this: moving outwards, each quadrant has 1.25 times the radius of the previous one. (note: my stroke-width here isn't meaningful)
		<path d="M0,0 a 1,1 0 00 -1,-1 a 1.25,1.25 0 00 -1.25,1.25 a 1.563,1.563 0 00 1.563,1.563 a 1.953,1.953 0 00 1.953,-1.953 a 2.441,2.441 0 00 -2.441,-2.441 a 3.052,3.052 0 00 -3.052,3.052 a 3.815,3.815 0 00 3.815,3.815 a 4.768,4.768 0 00 4.768,-4.768 a 5.96,5.96 0 00 -5.96,-5.96 a 7.451,7.451 0 00 -7.451,7.451 a 9.313,9.313 0 00 9.313,9.313 " stroke-width="1.37" stroke-linecap="round" fill="none" stroke="#f4900c" transform="translate(15.625 13.963) rotate(-28.06) scale(1.4307)"/>
		however, what this means for us is:
		we can fix the original path by just copying the last quadrant, rotating it -90°, and redoing the stroke.
